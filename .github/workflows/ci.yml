name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: |
          ruff check .

      - name: Pytest
        run: |
          pytest app/test_main.py -v

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Gitleaks (no secrets in repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env for compose (CI dummies, not secrets)
        run: |
          cp .env.example .env
          sed -i 's/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=ci-dummy-password/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-dummy-jwt-secret-32-chars-minimum/' .env

      - name: Build docker images
        run: docker compose build

      - name: Trivy scan (HIGH,CRITICAL fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: personal-devops-platform-app:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
