# Dev-override: только для локальной разработки.
# docker compose up в режиме разработки автоматически применяет этот файл.
# Для запуска в продакшене запускайте без override:
#   docker compose -f docker-compose.yml up -d
services:
  app:
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app
    read_only: false
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./scripts:/app/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
